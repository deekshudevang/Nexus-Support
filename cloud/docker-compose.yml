services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meshlink-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_PATH=/app/data/meshlink_sync.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - GATEWAY_API_KEYS=meshlink_gw_dev_secret
      - OPERATOR_TOKENS=meshlink_op_dev_secret
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
