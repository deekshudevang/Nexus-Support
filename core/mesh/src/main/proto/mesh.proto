syntax = "proto3";

// -----------------------------------------------------------------------------
// PROTOBUF VERSIONING RULES (DO NOT IGNORE)
// 1. Additive changes only. Never remove or rename existing fields.
// 2. Never reuse a field number. If a field is deprecated, prefix its name 
//    with `deprecated_` or use the `[deprecated=true]` option, and leave it.
// 3. Changing field types (e.g., uint32 to int32) breaks wire compatibility.
// -----------------------------------------------------------------------------

package meshtastic;

import "portnums.proto";

option java_package = "com.geeksville.mesh";
option java_outer_classname = "MeshProtos";

message MeshPacket {
  uint32 from = 1;
  uint32 to = 2;
  uint32 channel = 3;
  
  oneof payload_variant {
    Data decoded = 4;
    bytes encrypted = 5;
  }
  
  uint32 id = 6;
  uint32 rx_time = 7;
  float rx_snr = 8;
  uint32 hop_limit = 9;
  bool want_ack = 10;
  uint32 priority = 11;
  int32 rx_rssi = 12;
}

message Data {
  PortNum portnum = 1;
  bytes payload = 2;
  bool want_response = 3;
  uint32 dest = 4;
  uint32 source = 5;
  uint32 request_id = 6;
  uint32 reply_id = 7;
}

message FromRadio {
  uint32 id = 1;
  
  oneof payload_variant {
    MeshPacket packet = 2;
    MyNodeInfo my_info = 3;
    NodeInfo node_info = 4;
  }
}

message ToRadio {
  oneof payload_variant {
    MeshPacket packet = 1;
    bool disconnect = 2;
  }
}

message MyNodeInfo {
  uint32 my_node_num = 1;
  bool has_gps = 2;
  uint32 num_bands = 3;
}

message NodeInfo {
  uint32 num = 1;
  User user = 2;
  Position position = 3;
  float snr = 4;
  uint32 last_heard = 5;
}

message User {
  string id = 1;
  string long_name = 2;
  string short_name = 3;
  bytes macaddr = 4;
}

message Position {
  int32 latitude_i = 1;
  int32 longitude_i = 2;
  int32 altitude = 3;
  uint32 time = 4;
  uint32 location_source = 5;
  uint32 altitude_source = 6;
  uint32 timestamp = 7;
  uint32 timestamp_millis_adjust = 8;
  int32 PDOP = 10;
  uint32 HDOP = 11;
  uint32 VDOP = 12;
  uint32 sats_in_view = 13;
}
