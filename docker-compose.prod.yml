services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: rescuemesh-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescuemesh}
      POSTGRES_USER: ${POSTGRES_USER:-rescuemesh_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # No host port published in production; reachable only inside internal Docker network
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rescuemesh_app} -d ${POSTGRES_DB:-rescuemesh}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: rescuemesh-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - internal

  backend:
    build:
      context: ./cloud/backend
      dockerfile: Dockerfile
    container_name: rescuemesh-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?GATEWAY_API_KEYS must be set}
      OPERATOR_TOKENS: ${OPERATOR_TOKENS:?OPERATOR_TOKENS must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REVOKED_CREDENTIALS: ${REVOKED_CREDENTIALS:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - internal

  frontend:
    build:
      context: ./cloud/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
        VITE_WS_URL: ${VITE_WS_URL:?VITE_WS_URL must be set}
    container_name: rescuemesh-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: rescuemesh-prod-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE: ${CADDY_SITE:?CADDY_SITE must be set}
    volumes:
      - ./cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - internal
      - edge

networks:
  internal:
    internal: true
  edge:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
