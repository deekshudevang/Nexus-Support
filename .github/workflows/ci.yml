name: CI Pipeline

on:
  push:
    branches: [ master, main, 'feature/**', 'fix/**', 'release/**' ]
  pull_request:
    branches: [ master, main, 'feature/**', 'fix/**', 'release/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency:
    name: Structural Doc-Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run verify-docs.sh
        run: |
          chmod +x scripts/verify-docs.sh
          ./scripts/verify-docs.sh

  android-unit-and-migration-tests:
    name: Android Unit & Migration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run JVM Unit & Room Migration Tests
        run: ./gradlew testDebugUnitTest :core:domain:test --continue

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  android-build-and-lint:
    name: Android Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check for hardcoded local paths
        run: |
          if grep -q "org.gradle.java.home" gradle.properties; then
            echo "Error: Machine-specific Java home found in gradle.properties"
            exit 1
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: "**/build/reports/lint-results-debug.*"

  backend-tests:
    name: Cloud Backend Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cloud/backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/backend/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest cloud/backend/test_backend.py -v

  frontend-tests-and-build:
    name: Cloud Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cloud/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: cloud/frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: cloud/frontend
        run: npm run test

      - name: Build Production Dashboard Bundle
        working-directory: cloud/frontend
        run: npm run build

      - name: Verify No Secrets Inlined in Client Bundle
        working-directory: cloud/frontend
        run: |
          if grep -E "(meshlink_gw_dev_secret|meshlink_op_dev_secret)" -r dist/; then
            echo "Security Error: Secrets detected in built frontend bundle!"
            exit 1
          fi

  vulnerability-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Frontend Dependencies
        working-directory: cloud/frontend
        run: npm audit --audit-level=high || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Backend Dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r cloud/backend/requirements.txt || true
