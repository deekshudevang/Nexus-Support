name: Temporary Frontend Lockfile Refresh

on:
  push:
    branches: [ 'release/production-readiness' ]

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve the updated dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile for remote review
        run: cat package-lock.json
      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-frontend-lockfile
          path: cloud/frontend/package-lock.json
          if-no-files-found: error
